<script>
const CONTRATO = "E9qgVy6urPUrKBv3wymPSgSPbDGM5z77ZnVok4YvUmqE";
const CONFIG = {
    coinGecko: "https://api.coingecko.com/api/v3",
    dexScreener: "https://api.dexscreener.com/latest/dex/tokens",
    limitePagina: 250,
    totalPaginas: 10,
    tempoTimeout: 12000
};

let carregandoTodas = false;
let cacheMercado = { dados: [], ultimaAtualizacao: 0 };
let cotacaoUSD_BRL = 5.70;

function formatarBRL(valor){
    if(!valor || isNaN(valor) || valor === 0) return "---";
    const num = parseFloat(valor);
    return new Intl.NumberFormat('pt-BR', {
        style: 'currency', currency: 'BRL',
        maximumFractionDigits: num < 0.01 ? 8 : 2
    }).format(num);
}
function formatarVariacao(valor){
    if(!valor && valor !== 0) return "<span>--</span>";
    const num = parseFloat(valor);
    return `<span class="${num >= 0 ? 'var-positiva' : 'var-negativa'}">${num >= 0 ? '+' : ''}${num.toFixed(2)}%</span>`;
}

function navegarSecao(id){
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    document.querySelectorAll('.aba, .menu-item').forEach(b => b.classList.remove('ativo'));
    const secao = document.getElementById(id);
    if(secao) secao.classList.add('ativa');
    document.querySelectorAll(`[data-secao="${id}"]`).forEach(b => b.classList.add('ativo'));
    document.getElementById('menuNavegacao').classList.remove('aberto');
    document.getElementById('resultadoBusca').classList.remove('visivel');
    window.scrollTo(0,0);
}

function abrirGraficoMoeda(id, nome, simbolo = ""){
    const titulo = document.getElementById('tituloGrafico');
    const container = document.getElementById('graficoUniversal');
    if(!titulo || !container) return;

    if(id === CONTRATO || simbolo?.toUpperCase() === "DGM"){
        titulo.innerHTML = "📈 GRÁFICO — Doge Manga Evolution ($DGM) | Doge Manga Evolution";
        container.innerHTML = `<iframe src="https://dexscreener.com/solana/${CONTRATO}?embed=1&theme=dark&chart=1" width="100%" height="100%" frameborder="0" allowfullscreen loading="lazy"></iframe>`;
    } else {
        titulo.innerHTML = `📈 GRÁFICO — ${nome} (${simbolo.toUpperCase()}) | Doge Manga Evolution`;
        const simboloUpper = simbolo.toUpperCase();
        container.innerHTML = `<iframe src="https://dexscreener.com/search?q=${encodeURIComponent(simboloUpper)}&embed=1&theme=dark&chart=1" width="100%" height="100%" frameborder="0" allowfullscreen loading="lazy"></iframe>`;
    }
    navegarSecao('graficoMoeda');
}

function copiarTexto(texto){
    navigator.clipboard.writeText(texto).then(() => {
        const aviso = document.getElementById('avisoCopiado');
        aviso.textContent = "✅ CONTRATO COPIADO COM SUCESSO!";
        aviso.style.display = "block";
        setTimeout(() => aviso.style.display = "none", 2000);
    }).catch(() => alert("Copie manualmente o contrato"));
}

async function atualizarCotacao(){
    try{
        const res = await fetch(`${CONFIG.coinGecko}/simple/price?ids=usd&vs_currencies=brl`, { signal: AbortSignal.timeout(CONFIG.tempoTimeout) });
        if(res.ok){
            const dados = await res.json();
            cotacaoUSD_BRL = dados.usd.brl || 5.70;
        }
    }catch{ cotacaoUSD_BRL = 5.70; }
}

async function atualizarDGM(){
    try{
        const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${CONTRATO}`, { cache: 'no-store', signal: AbortSignal.timeout(CONFIG.tempoTimeout) });
        if(!res.ok) throw new Error("API instável");
        const dados = await res.json();
        const par = dados?.pairs?.find(p => p.chainId === "solana") || dados?.pairs?.[0];
        if(!par) throw new Error("Par não encontrado");

        const precoUSD = Number(par.priceUsd || 0);
        const var24h = Number(par.priceChange?.h24 || 0);
        const liquidezUSD = Number(par.liquidity?.usd || 0);
        const volumeUSD = Number(par.volume?.h24 || 0);
        const marketCapUSD = Number(par.fdv || 0);

        document.getElementById('dgm-preco-barra').innerText = formatarBRL(precoUSD * cotacaoUSD_BRL);
        document.getElementById('var-dgm').innerHTML = formatarVariacao(var24h);
        document.getElementById('precoAtual').innerText = formatarBRL(precoUSD * cotacaoUSD_BRL);
        document.getElementById('var24h').innerHTML = formatarVariacao(var24h);
        document.getElementById('liquidez').innerText = formatarBRL(liquidezUSD * cotacaoUSD_BRL);
        document.getElementById('volume24h').innerText = formatarBRL(volumeUSD * cotacaoUSD_BRL);
        document.getElementById('marketcap').innerText = formatarBRL(marketCapUSD * cotacaoUSD_BRL);
        document.getElementById('ultimaDGM').innerText = new Date().toLocaleTimeString('pt-BR');
    }catch(e){
        console.warn("Erro DGM:", e.message);
        document.getElementById('dgm-preco-barra').innerText = "---";
        document.getElementById('precoAtual').innerText = "---";
    }
}

async function carregarTopGainers(){
    const container = document.getElementById('conteudoTopGainers');
    if(!container) return;
    try{
        const res = await fetch(`${CONFIG.coinGecko}/coins/markets?vs_currency=brl&order=price_change_percentage_24h_desc&per_page=20&page=1&sparkline=false`, { signal: AbortSignal.timeout(CONFIG.tempoTimeout) });
        if(!res.ok) throw new Error();
        const dados = await res.json();
        const altas = dados.filter(m => m.price_change_percentage_24h > 0).slice(0,12);
        if(altas.length === 0){ container.innerHTML = `<span style="color:var(--claro);">Nenhuma alta no momento</span>`; return; }
        container.innerHTML = altas.map(m => `
            <div class="item-alta" onclick="abrirGraficoMoeda(${JSON.stringify(m.id)}, ${JSON.stringify(m.name)}, ${JSON.stringify(m.symbol)})">
                <img src="${m.image}" loading="lazy" onerror="this.src='IMG-20260727-WA0036(7).jpg'">
                <strong>${m.symbol.toUpperCase()}</strong>
                <span>${formatarBRL(m.current_price)}</span>
                <span style="color:var(--sucesso);font-weight:600;">+${m.price_change_percentage_24h.toFixed(2)}%</span>
            </div>
        `).join("");
    }catch(e){
        console.warn("Erro Top Gainers:", e);
        container.innerHTML = `<span style="color:var(--queda);">Não foi possível carregar</span>`;
    }
}

async function carregarMercadoCompleto(){
    if(carregandoTodas) return;
    carregandoTodas = true;
    const status = document.getElementById('ultimaMercado');
    try{
        cacheMercado.dados = [];
        document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;">🔄 Atualizando mercado...</td></tr>`;
        for(let pagina = 1; pagina <= CONFIG.totalPaginas; pagina++){
            if(status) status.innerText = `🔄 Carregando página ${pagina} de ${CONFIG.totalPaginas}...`;
            const res = await fetch(`${CONFIG.coinGecko}/coins/markets?vs_currency=brl&order=market_cap_desc&per_page=${CONFIG.limitePagina}&page=${pagina}&sparkline=false&price_change_percentage=24h`, { signal: AbortSignal.timeout(CONFIG.tempoTimeout) });
            if(!res.ok) continue;
            const dados = await res.json();
            if(Array.isArray(dados)) cacheMercado.dados.push(...dados);
            renderizarTabela();
            await new Promise(resolve => setTimeout(resolve, 250));
        }
        cacheMercado.ultimaAtualizacao = Date.now();
        if(status) status.innerText = `✅ ${cacheMercado.dados.length} moedas — ${new Date().toLocaleTimeString('pt-BR')}`;
        document.getElementById('btnMais').innerText = "✅ Mercado Atualizado";
        document.getElementById('btnMais').disabled = true;
    }catch(e){
        console.warn("Erro Mercado:", e);
        if(status) status.innerText = "⚠️ Carregamento parcial";
        renderizarTabela();
    }
    carregandoTodas = false;
}

function renderizarTabela(){
    const tabela = document.getElementById('corpoTabela');
    if(!tabela) return;
    if(cacheMercado.dados.length === 0){
        tabela.innerHTML = `<tr><td colspan="7" style="color:var(--claro);text-align:center;">Nenhuma moeda carregada</td></tr>`;
        return;
    }
    tabela.innerHTML = cacheMercado.dados.map(m => `
        <tr>
            <td>${m.market_cap_rank || '-'}</td>
            <td><div class="moeda-linha"><img src="${m.image}" loading="lazy" onerror="this.src='IMG-20260727-WA0036(7).jpg'"><div><strong>${m.name}</strong><br><small>${m.symbol.toUpperCase()}</small></div></div></td>
            <td><strong>${formatarBRL(m.current_price)}</strong></td>
            <td>${formatarVariacao(m.price_change_percentage_24h)}</td>
            <td>${formatarBRL(m.market_cap)}</td>
            <td>${formatarBRL(m.total_volume)}</td>
            <td><button class="btn btn-pequeno btn-primario" onclick="abrirGraficoMoeda(${JSON.stringify(m.id)}, ${JSON.stringify(m.name)}, ${JSON.stringify(m.symbol)})">📊</button></td>
        </tr>
    `).join('');
}

let timerPesquisa;
const campoBusca = document.getElementById('campoBusca');
const resultadoBusca = document.getElementById('resultadoBusca');
if(campoBusca && resultadoBusca){
campoBusca.addEventListener('input', () => {
    clearTimeout(timerPesquisa);
    timerPesquisa = setTimeout(async () => {
        const termo = campoBusca.value.trim();
        if(!termo || termo.length < 2){ 
            resultadoBusca.classList.remove('visivel'); 
            resultadoBusca.innerHTML = "";
            return; 
        }
        try{
            const res = await fetch(`${CONFIG.coinGecko}/search?query=${encodeURIComponent(termo)}`, { signal: AbortSignal.timeout(CONFIG.tempoTimeout) });
            const dados = await res.json();
            resultadoBusca.innerHTML = "";
            resultadoBusca.classList.add('visivel');
            if(dados.coins?.length > 0){
                dados.coins.slice(0,8).forEach(m => {
                    resultadoBusca.innerHTML += `
                    <div class="item-resultado" onclick="abrirGraficoMoeda(${JSON.stringify(m.id)}, ${JSON.stringify(m.name)}, ${JSON.stringify(m.symbol)})">
                        <img src="${m.thumb}" loading="lazy" onerror="this.src='IMG-20260727-WA0036(7).jpg'">
                        <div><strong>${m.name}</strong><br><span>${m.symbol.toUpperCase()}</span></div>
                    </div>
                    `;
                });
            }else{
                resultadoBusca.innerHTML = `<div style="padding:15px;text-align:center;color:var(--claro);">Nenhuma moeda encontrada</div>`;
            }
        }catch(e){
            console.warn("Erro Busca:", e);
            resultadoBusca.innerHTML = `<div style="padding:15px;text-align:center;color:var(--queda);">Erro na busca</div>`;
            resultadoBusca.classList.add('visivel');
        }
    }, 350);
});
}

document.getElementById('btnCopiarContrato').addEventListener('click', () => copiarTexto(CONTRATO));
document.getElementById('btnMenu').addEventListener('click', (e)=>{
    e.stopPropagation();
    document.getElementById('menuNavegacao').classList.toggle('aberto');
});
document.addEventListener('click', (e) => {
    const menu = document.getElementById('menuNavegacao');
    if(menu && !e.target.closest('#btnMenu') && !e.target.closest('#menuNavegacao')){
        menu.classList.remove('aberto');
    }
});
document.getElementById('btnMais').addEventListener('click', carregarMercadoCompleto);
document.getElementById('btnAbrirForm').addEventListener('click', ()=>{
    const form = document.getElementById('formProj');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

document.querySelectorAll('[data-secao]').forEach(el => {
    el.addEventListener('click', (e) => {
        e.preventDefault();
        navegarSecao(el.dataset.secao);
    });
});

    setTimeout(() => {
        const
