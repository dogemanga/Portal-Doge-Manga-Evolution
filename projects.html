<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeto | Doge Manga Evolution</title>

<style>

body{
background:#050816;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#111827;
border:1px solid #2563eb;
border-radius:20px;
padding:25px;
margin-bottom:20px;
}

h1,h2{
color:#facc15;
}

.logo{
width:150px;
height:150px;
border-radius:20px;
object-fit:cover;
}

a{
color:#38bdf8;
}

.info{
background:#020617;
padding:15px;
border-radius:15px;
margin-top:10px;
}

iframe{
border-radius:15px;
}

</style>

</head>


<body>


<div class="container">


<div class="card" id="dadosProjeto">

<h1>Carregando projeto...</h1>

</div>


<div class="card">

<h2>📊 Dados de Mercado</h2>

<div class="info" id="preco">
💰 Preço: Carregando...
</div>

<div class="info" id="marketcap">
📊 Market Cap: Carregando...
</div>

<div class="info" id="volume">
📈 Volume 24h: Carregando...
</div>

<div class="info" id="liquidez">
💧 Liquidez: Carregando...
</div>

</div>


<div class="card">

<h2>📈 Gráfico</h2>

<div id="grafico">

Carregando gráfico...

</div>

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://wudayugjctzhwnjdjsrx.supabase.co";


const SUPABASE_KEY =
"COLE_AQUI_SUA_CHAVE_PUBLICA";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function carregarProjeto(){


const params =
new URLSearchParams(
window.location.search
);


const id =
params.get("id");



const {data,error} =
await supabaseClient
.from("projetos")
.select("*")
.eq("id",id)
.single();



if(error){

document.getElementById("dadosProjeto").innerHTML =
"Projeto não encontrado";

return;

}



document.getElementById("dadosProjeto").innerHTML = `

<h1>${data.nome}</h1>

<p>🟢 Rede: ${data.rede}</p>

<p>📄 Contrato:</p>

<p>${data.contrato}</p>

<p>🌐 Site:
<a href="${data.site}" target="_blank">
${data.site}
</a>
</p>

<p>𝕏:
<a href="${data.twitter}" target="_blank">
${data.twitter}
</a>
</p>


<h2>Descrição</h2>

<p>
${data.descricao}
</p>

`;



carregarMercado(data.contrato);


}



async function carregarMercado(contrato){


try{


const resposta =
await fetch(
`https://api.dexscreener.com/latest/dex/tokens/${contrato}`
);


const dados =
await resposta.json();


const par =
dados.pairs[0];


document.getElementById("preco").innerHTML =
"💰 Preço: $" + par.priceUsd;


document.getElementById("marketcap").innerHTML =
"📊 Market Cap: $" + par.marketCap;


document.getElementById("volume").innerHTML =
"📈 Volume 24h: $" + par.volume.h24;


document.getElementById("liquidez").innerHTML =
"💧 Liquidez: $" + par.liquidity.usd;



document.getElementById("grafico").innerHTML = `

<iframe

src="https://dexscreener.com/solana/${contrato}?embed=1&theme=dark"

width="100%"

height="500"

frameborder="0">

</iframe>

`;



}catch(erro){

console.log(erro);

}


}



carregarProjeto();


</script>


</body>

</html>
