<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga Evolution</title>

<style>

body{

background:#050816;
color:white;
font-family:Arial;
text-align:center;

}


.container{

max-width:450px;
margin:50px auto;
background:#111827;
padding:25px;
border-radius:20px;

}


h1{

color:#facc15;

}


button{

background:#facc15;
border:0;
padding:15px 25px;
border-radius:15px;
font-size:18px;
cursor:pointer;

}


input,select{

width:90%;
padding:12px;
margin:10px;
border-radius:10px;

}


#wallet{

color:#38bdf8;
margin:20px;

}

</style>

</head>


<body>


<div class="container">


<h1>
🔄 Swap Doge Manga
</h1>


<p>
Solana Ecosystem
</p>


<button onclick="connectWallet()">
Conectar Phantom
</button>


<div id="wallet">
Carteira desconectada
</div>



<select id="from">

<option>SOL</option>
<option>USDC</option>
<option>DGM</option>

</select>



<input 
id="amount"
placeholder="Quantidade"
type="number"
>



<select id="to">

<option>DGM</option>
<option>SOL</option>
<option>USDC</option>

</select>


<br>


<button onclick="startSwap()">
🚀 Trocar Agora
</button>


<p id="result"></p>



</div>



<script>


// =================================
// CARTEIRA DO ECOSSISTEMA
// =================================

const TAX_WALLET =
"2EYaAxuqQtQ52gBMkXBF4859p68BPabE113UNbxqLU2f";


// TAXA 1%

const ECOSYSTEM_FEE = 0.01;



let userWallet = null;




// CONECTAR PHANTOM

async function connectWallet(){


if(window.solana){


const response =
await window.solana.connect();


userWallet =
response.publicKey.toString();


document.getElementById("wallet").innerHTML =

"Carteira: <br>"+userWallet;


}

else{


alert(
"Instale a Phantom Wallet"
);


}


}




// INICIAR SWAP

function startSwap(){



if(!userWallet){

alert(
"Conecte sua carteira primeiro"
);

return;

}



let amount =
Number(
document.getElementById("amount").value
);



let fee =
amount * ECOSYSTEM_FEE;



document.getElementById("result").innerHTML =


`
Swap preparado ✅

<br><br>

Taxa do ecossistema:
${fee}

<br><br>

Destino da taxa:

${TAX_WALLET}

`;



}



</script>


</body>

</html>
