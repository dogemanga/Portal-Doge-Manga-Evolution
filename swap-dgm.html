<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga</title>

<style>
body{
    background:#050816;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.box{
    max-width:450px;
    margin:auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
    border:1px solid #facc15;
}

button{
    background:#facc15;
    border:0;
    padding:15px;
    width:90%;
    border-radius:15px;
    font-weight:bold;
    cursor:pointer;
    margin:10px;
}

select,input{
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:10px;
}

#wallet{
    color:#38bdf8;
    word-break:break-all;
}

#status{
    color:#facc15;
}
</style>

</head>

<body>

<div class="box">

<h1>🔄 Swap Doge Manga</h1>

<button onclick="connectWallet()">
🔗 Conectar Phantom
</button>

<p id="wallet">
Carteira desconectada
</p>


<select id="from">
<option value="SOL">SOL</option>
<option value="USDC">USDC</option>
</select>


<input id="amount" placeholder="Quantidade">


<button onclick="buscarCotacao()">
💹 Buscar Cotação Jupiter
</button>


<p id="quote">
Cotação: -
</p>


<button onclick="swap()">
🚀 Trocar Agora
</button>


<p id="status"></p>


</div>


<script>

const TAX_WALLET =
"2EYaAxuqQtQ52gBMkXBF4859p68BPabE113UNbxqLU2f";


const DGM_MINT =
"E9qgVy6urPUrKBv3wymPSgSPbDGM5z77ZnVok4YvUmqE";


let wallet = null;


// Conectar Phantom

async function connectWallet(){

if(!window.solana){

alert("Abra pelo navegador da Phantom");

return;

}

try{

let resp =
await window.solana.connect();

wallet =
resp.publicKey.toString();


document.getElementById("wallet").innerHTML =
"Conectada: "+wallet;


}catch(e){

alert(e.message);

}

}



// Busca cotação Jupiter

async function buscarCotacao(){

let amount =
document.getElementById("amount").value;


if(!amount){

alert("Digite a quantidade");

return;

}


document.getElementById("status").innerHTML =
"Buscando Jupiter...";


/*
Aqui entra a chamada real da Jupiter Quote API.
Ela usa:
token de entrada
token DGM de saída
quantidade
*/


document.getElementById("quote").innerHTML =
"Jupiter encontrado. Preparando rota para DGM";


document.getElementById("status").innerHTML =
"✅ Cotação carregada";


}



// Executar swap

async function swap(){


if(!wallet){

alert("Conecte a Phantom primeiro");

return;

}


document.getElementById("status").innerHTML =
"🚀 Preparando transação Jupiter...";


}

</script>

</body>
</html>
