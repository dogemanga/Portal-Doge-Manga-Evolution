<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga Evolution</title>

<style>

body{
    background:#050816;
    color:white;
    font-family:Arial;
    text-align:center;
}

.box{
    max-width:450px;
    margin:40px auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
}

h1{
    color:#facc15;
}

button{

    background:#facc15;
    color:#000;
    border:0;
    padding:15px 25px;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;

}


select,input{

    width:90%;
    padding:12px;
    margin:10px;
    border-radius:10px;

}


#wallet{

    color:#38bdf8;
    margin:20px;

}

</style>

</head>


<body>


<div class="box">


<h1>
🔄 Swap Doge Manga
</h1>


<p>
Solana Jupiter Swap
</p>



<button onclick="connectWallet()">
🔗 Conectar Phantom
</button>


<div id="wallet">
Carteira desconectada
</div>



<select id="fromToken">

<option value="SOL">
SOL
</option>

<option value="USDC">
USDC
</option>

<option value="DGM">
Doge Manga
</option>

</select>



<input 
id="amount"
type="number"
placeholder="Quantidade"
/>



<select id="toToken">

<option value="DGM">
Doge Manga
</option>

<option value="SOL">
SOL
</option>

<option value="USDC">
USDC
</option>

</select>



<br><br>



<button onclick="swap()">
🚀 Trocar Agora
</button>



<p id="status"></p>



</div>



<script>


// ==============================
// CARTEIRA DA TAXA ECOSSISTEMA
// ==============================


const TAX_WALLET =
"2EYaAxuqQtQ52gBMkXBF4859p68BPabE113UNbxqLU2f";


// 1%

const ECOSYSTEM_FEE = 0.01;



// MINT DO DGM
// colocar depois o endereço correto

const DGM_MINT =
"COLOCAR_MINT_DGM";



let walletAddress = null;



// ==============================
// CONECTAR PHANTOM
// ==============================


async function connectWallet(){


if(window.solana){


const response =
await window.solana.connect();


walletAddress =
response.publicKey.toString();


document.getElementById("wallet").innerHTML =

"Carteira conectada:<br>" +
walletAddress;


}

else{


alert(
"Abra usando uma carteira Solana"
);


}


}




// ==============================
// BOTÃO SWAP
// ==============================


function swap(){



if(!walletAddress){

alert(
"Conecte sua carteira primeiro"
);

return;

}



let amount =
document.getElementById("amount").value;


let from =
document.getElementById("fromToken").value;


let to =
document.getElementById("toToken").value;



let fee =
amount * ECOSYSTEM_FEE;



document.getElementById("status").innerHTML =

`
Swap preparado ✅

<br><br>

${amount} ${from}
→
${to}

<br><br>

Taxa ecossistema:
${fee}

<br><br>

Carteira:
${TAX_WALLET}

`;



}


</script>


</body>

</html>
