<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga Evolution</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
    border:1px solid #facc15;
}

h1{
    text-align:center;
    color:#facc15;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#facc15;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

select,input{

    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
}

.info{

    text-align:center;
    margin-top:20px;

}

</style>

</head>


<body>


<div class="container">


<h1>🚀 Doge Manga Swap</h1>


<p style="text-align:center;">
Troque SOL, USDC e DGM.
</p>


<button onclick="conectarCarteira()">
🟣 Conectar Phantom
</button>



<label>Você envia:</label>

<select id="tokenFrom">

<option>SOL</option>
<option>USDC</option>
<option>DGM</option>

</select>



<label>Quantidade:</label>

<input 
id="amount"
type="number"
placeholder="0.00">



<label>Você recebe:</label>

<select id="tokenTo">

<option>DGM</option>
<option>SOL</option>
<option>USDC</option>

</select>



<div class="info">

Estimativa:

<h2 id="resultado">
0.00
</h2>

</div>



<button onclick="fazerSwap()">
🔄 Fazer Swap
</button>



</div>



<script src="js/config.js"></script>
<script src="js/wallet.js"></script>
<script src="js/swap.js"></script>


</body>

</html>
