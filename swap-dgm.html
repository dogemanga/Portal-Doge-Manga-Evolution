<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga</title>

<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>

<style>

body{
background:#050816;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#111827;
padding:25px;
border-radius:20px;
border:1px solid #facc15;
}

h1{
color:#facc15;
}

button{
width:90%;
padding:15px;
margin:10px;
border:0;
border-radius:15px;
background:#facc15;
font-weight:bold;
cursor:pointer;
}

input,select{
width:90%;
padding:12px;
margin:8px;
border-radius:10px;
background:#1f2937;
color:white;
border:0;
}

#wallet{
color:#38bdf8;
word-break:break-all;
}

#status,#quote{
color:#facc15;
}

</style>

</head>


<body>

<div class="box">

<h1>🐕 Swap Doge Manga</h1>

<button onclick="connectWallet()">
🔗 Conectar Phantom
</button>

<p id="wallet">
Carteira desconectada
</p>


<h3>Enviar</h3>

<select id="tokenFrom">

<option value="SOL">SOL</option>
<option value="USDC">USDC</option>
<option value="DGM">DGM</option>

</select>


<input id="amount" type="number" placeholder="Quantidade">


<h3>Receber</h3>

<select id="tokenTo">

<option value="DGM">DGM</option>
<option value="SOL">SOL</option>
<option value="USDC">USDC</option>

</select>


<p id="quote">
Cotação: -
</p>


<button onclick="getQuote()">
💹 Buscar Cotação Jupiter
</button>


<button id="swapBtn" onclick="swap()" disabled>
🚀 Trocar Agora
</button>


<p id="status"></p>


</div>
