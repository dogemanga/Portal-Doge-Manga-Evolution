<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga</title>

<style>

body{
    background:#050816;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.box{
    max-width:450px;
    margin:auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
    border:1px solid #facc15;
}

h1{
    color:#facc15;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:15px;
    border:0;
    background:#facc15;
    font-weight:bold;
    cursor:pointer;
}

input,select{

    width:90%;
    padding:12px;
    margin:10px;
    border-radius:10px;

}

#wallet{

    color:#38bdf8;
    word-break:break-all;

}

#status{

    color:#facc15;

}

</style>

</head>

<body>


<div class="box">


<h1>
🐕 Swap Doge Manga
</h1>


<button onclick="connectWallet()">
🔗 Conectar Phantom
</button>


<p id="wallet">
Carteira desconectada
</p>


<h3>Enviar</h3>

<input id="searchToken"
placeholder="Buscar token SOL, USDC, JUP...">


<select id="tokenList">

<option>
SOL
</option>

</select>



<input 
id="amount"
placeholder="Quantidade"
type="number">


<h3>Receber</h3>

<select>

<option>
DGM
</option>

</select>


<p id="quote">

Cotação: -

</p>



<button onclick="getQuote()">

💹 Buscar Cotação Jupiter

</button>



<button onclick="swap()">

🚀 Trocar Agora

</button>


<p id="status"></p>


</div>



<script>


const TAX_WALLET =
"2EYaAxuqQtQ52gBMkXBF4859p68BPabE113UNbxqLU2f";


const DGM_MINT =
"E9qgVy6urPUrKBv3wymPSgSPbDGM5z77ZnVok4YvUmqE";


let wallet = null;



async function connectWallet(){

if(!window.solana){

alert("Abra pelo navegador da Phantom");

return;

}


try{

let resp =
await window.solana.connect();


wallet =
resp.publicKey.toString();


document.getElementById("wallet").innerHTML =
"Conectada: "+wallet;


}catch(e){

alert(e.message);

}


}




async function getQuote(){


let amount =
document.getElementById("amount").value;


if(!amount){

alert("Digite a quantidade");

return;

}


document.getElementById("status").innerHTML =
"Buscando Jupiter...";


// Aqui entra a cotação Jupiter


document.getElementById("quote").innerHTML =
"Rota encontrada para DGM";


document.getElementById("status").innerHTML =
"✅ Cotação pronta";


}




async function swap(){


if(!wallet){

alert("Conecte a Phantom");

return;

}


document.getElementById("status").innerHTML =
"🚀 Preparando Swap Jupiter...";


}



</script>


</body>

</html>
