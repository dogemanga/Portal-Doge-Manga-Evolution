<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga Evolution</title>

<style>

body{

    margin:0;
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;

}


.container{

    max-width:500px;
    margin:40px auto;
    background:#111827;
    padding:30px;
    border-radius:20px;
    border:1px solid #facc15;

}


h1{

    text-align:center;
    color:#facc15;

}


button{

    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#facc15;
    color:#000;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;

}


select,
input{

    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;

}


.resultado{

    margin-top:20px;
    text-align:center;
    color:#38bdf8;

}


</style>

</head>


<body>


<div class="container">


<h1>🚀 Swap Doge Manga</h1>


<p align="center">
Troque SOL, USDC e DGM pelo ecossistema Doge Manga.
</p>



<button onclick="conectarCarteira()">

🟣 Conectar Phantom

</button>



<h3>Você envia:</h3>


<select id="tokenFrom">

<option>SOL</option>
<option>USDC</option>
<option>DGM</option>

</select>



<input 
id="amount"
type="number"
placeholder="Quantidade">



<h3>Você recebe:</h3>


<select id="tokenTo">

<option>DGM</option>
<option>SOL</option>
<option>USDC</option>

</select>



<div class="resultado" id="resultado">

0.00

</div>



<button onclick="fazerSwap()">

🔄 Fazer Swap

</button>



</div>



<script src="js/wallet.js"></script>

<script src="js/swap.js"></script>


</body>

</html>
