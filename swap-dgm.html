<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swap Doge Manga Evolution</title>

<style>

body{
    background:#050816;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:20px;
}

.box{
    max-width:450px;
    margin:40px auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
    border:1px solid #facc15;
}

h1{
    color:#facc15;
}

button{
    width:90%;
    background:#facc15;
    border:0;
    padding:15px;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

select,input{

    width:90%;
    padding:12px;
    margin:10px;
    border-radius:10px;
    background:#1f2937;
    color:white;
    border:0;

}

#wallet{

    color:#38bdf8;
    word-break:break-all;

}

#status{

    color:#9ca3af;

}

</style>

</head>


<body>


<div class="box">


<h1>
🐕 Swap Doge Manga
</h1>


<button onclick="connectWallet()">
🔗 Conectar Phantom
</button>


<p id="wallet">
Carteira desconectada
</p>



<h3>
🔎 Buscar moeda
</h3>


<input 
id="search"
placeholder="BTC, ETH, SOL, PEPE..."
oninput="filterTokens()"
>



<select id="tokenFrom">

</select>



<h3>
Receber
</h3>


<select id="tokenTo">

<option value="DGM">
🐕 Doge Manga (DGM)
</option>

</select>



<input 
id="amount"
placeholder="Quantidade"
type="number"
>



<button onclick="swap()">
🚀 Trocar Agora
</button>



<p id="status"></p>


</div>




<script>


const TAX_WALLET =
"2EYaAxuqQtQ52gBMkXBF4859p68BPabE113UNbxqLU2f";


const DGM_MINT =
"E9qgVy6urPUrKBv3wymPSgSPbDGM5z77ZnVok4YvUmqE";



let wallet=null;



const tokens=[

"BTC",
"ETH",
"SOL",
"USDC",
"USDT",
"JUP",
"BONK",
"PEPE",
"WLD",
"HBAR",
"XRP",
"ZEC",
"DGM"

];



function loadTokens(){

let select=
document.getElementById("tokenFrom");


select.innerHTML="";


tokens.forEach(token=>{


let option=
document.createElement("option");


option.value=token;

option.text=
token;


select.appendChild(option);


});


}



function filterTokens(){


let busca=
document.getElementById("search").value.toUpperCase();


let select=
document.getElementById("tokenFrom");


select.innerHTML="";


tokens
.filter(t=>t.includes(busca))
.forEach(token=>{


let option=
document.createElement("option");


option.value=token;

option.text=token;


select.appendChild(option);


});


}



async function connectWallet(){


if(window.solana){


let resp=
await window.solana.connect();


wallet=
resp.publicKey.toString();


document.getElementById("wallet").innerHTML=
"Conectada:<br>"+wallet;


}

else{


alert("Abra pela Phantom");


}


}



function swap(){


if(!wallet){

alert("Conecte a carteira");

return;

}



document.getElementById("status").innerHTML=

`
Preparando Jupiter Swap...

<br><br>

Taxa ecossistema:

${TAX_WALLET}

<br><br>

Token DGM:

${DGM_MINT}

`;

}



loadTokens();


</script>


</body>

</html>
