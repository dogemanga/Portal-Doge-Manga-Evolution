<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swap Doge Manga Evolution</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:#111827;
    padding:25px;
    border-radius:20px;
    border:1px solid #facc15;
}

h1{
    color:#facc15;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
}

select,input{
    width:100%;
    padding:12px;
    border-radius:10px;
    margin-top:5px;
    border:none;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    background:#facc15;
    color:#000;
    font-weight:bold;
}

.info{
    margin-top:20px;
    text-align:center;
    color:#9ca3af;
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Doge Manga Swap</h1>

<p style="text-align:center;">
Troque SOL, USDC e DGM de forma rápida e segura.
</p>

<button onclick="conectarCarteira()">
🟣 Conectar Phantom
</button>

<label>Você envia</label>

<select id="tokenFrom">
<option>SOL</option>
<option>USDC</option>
<option>DGM</option>
</select>

<label>Quantidade</label>

<input
type="number"
id="amount"
placeholder="0.00">

<label>Você recebe</label>

<select id="tokenTo">
<option>DGM</option>
<option>SOL</option>
<option>USDC</option>
</select>

<div class="info">

Estimativa:<br>

<strong id="resultado">
0.00
</strong>

</div>

<button id="swapButton">
🔄 Fazer Swap
</button>

</div>
