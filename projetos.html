<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projetos em Destaque | Doge Manga</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#050816;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1,h2{
color:#facc15;
text-align:center;
}

#lista{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;

}

.card-projeto{

background:#111827;
border:1px solid #2563eb;
border-radius:20px;
padding:20px;
text-align:center;

}

.card-projeto img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;

}

.btn{

display:inline-block;
margin-top:15px;
padding:12px 20px;
background:#facc15;
color:#050816;
border-radius:20px;
text-decoration:none;
font-weight:bold;

}


.chat{

margin-top:40px;
background:#111827;
border:1px solid #38bdf8;
border-radius:20px;
padding:20px;

}


#mensagens{

height:250px;
overflow:auto;
background:#050816;
padding:10px;
border-radius:10px;

}


input,textarea{

width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;

}


button{

margin-top:10px;
padding:12px 20px;
border-radius:20px;
background:#facc15;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1>🔥 Projetos em Destaque</h1>

<div id="lista">
Carregando projetos...
</div>
